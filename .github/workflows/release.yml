name: Release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ya_existe: ${{ steps.check.outputs.ya_existe }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión de pyproject.toml
        id: version
        shell: python
        run: |
          import tomllib, os
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={data['project']['version']}\n")

      - name: Verificar si el tag ya existe
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}$"; then
            echo "El tag v${{ steps.version.outputs.version }} ya existe, no se crea un release nuevo."
            echo "ya_existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "ya_existe=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.ya_existe != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: gmaps-scraper-linux-x64V${{ needs.check-version.outputs.version }}
          - os: windows-latest
            name: gmaps-scraper-windows-x64V${{ needs.check-version.outputs.version }}
          - os: macos-14 # runner Apple Silicon nativo (arm64); macos-13 y anteriores son Intel
            name: gmaps-scraper-macos-arm64V${{ needs.check-version.outputs.version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build binario (empaqueta la app web, templates/, static/ y pyproject.toml)
        shell: bash
        run: |
          SEP=":"
          if [ "${{ runner.os }}" = "Windows" ]; then SEP=";"; fi
          pyinstaller app.py --name "${{ matrix.name }}" --onefile \
            --collect-all playwright --collect-data folium \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            --add-data "pyproject.toml${SEP}."

      - name: Resolver ruta del binario (PyInstaller agrega .exe solo en Windows)
        id: asset
        shell: bash
        run: |
          BIN="dist/${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Verificar binario (levanta el servidor y hace una petición HTTP)
        shell: bash
        run: |
          "${{ steps.asset.outputs.path }}" &
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || true)
            if [ "$codigo" = "200" ]; then
              echo "El servidor respondió correctamente (HTTP 200)."
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no respondió a tiempo."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.asset.outputs.path }}

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.ya_existe != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Crear y publicar el tag
        run: |
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: "Google Maps Scraper v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          files: dist-all/*

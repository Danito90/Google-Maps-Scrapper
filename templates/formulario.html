{% extends "base.html" %}
{% block titulo %}Google Maps Scraper{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <p class="mb-6 text-slate-600">
            Buscá negocios en Google Maps, visualizalos en un mapa y exportá los resultados a CSV o Excel.
        </p>

        {% if hay_busqueda_previa %}
        <a href="{{ url_for('resultados') }}" class="mb-6 inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 hover:text-brand-700">
            Ver última búsqueda
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
        </a>
        {% endif %}

        <form action="{{ url_for('buscar') }}" method="post" class="space-y-5">
            <div>
                <label for="busqueda" class="mb-1.5 block text-sm font-medium text-slate-700">Término de búsqueda</label>
                <input type="text" id="busqueda" name="busqueda" placeholder="Ej: panaderías en Junín" required
                    class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
            </div>

            <div>
                <label for="total" class="mb-1.5 block text-sm font-medium text-slate-700">Cantidad de resultados</label>
                <input type="number" id="total" name="total" min="1" value="5" required
                    class="block w-32 rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
            </div>

            <div class="space-y-3 rounded-xl bg-slate-50 p-4">
                <label class="flex items-start gap-3 text-sm text-slate-700">
                    <input type="checkbox" name="buscar_email" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-2 focus:ring-brand-500/30">
                    <span>Buscar email en el sitio web de cada negocio <span class="text-slate-400">(más lento, no siempre disponible)</span></span>
                </label>

                <label class="flex items-start gap-3 text-sm text-slate-700">
                    <input type="checkbox" name="headless" checked class="mt-0.5 h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-2 focus:ring-brand-500/30">
                    <span>Modo invisible <span class="text-slate-400">(headless, sin ventana visible del navegador)</span></span>
                </label>
            </div>

            <button type="submit"
                class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:ring-offset-2">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                Buscar
            </button>
        </form>
    </div>
</div>
{% endblock %}
